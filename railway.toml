[build]
builder = "nixpacks"
buildCommand = "npm install && npm run build"

[variables]
NIXPACKS_NODE_VERSION = "20"
NODE_VERSION = "20.19.0"

[deploy]
startCommand = "npm start -- -p $PORT -H 0.0.0.0"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "onFailure"
restartPolicyMaxRetries = 10
